name: Publish snapshot

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      message: ${{ steps.snapshot.outputs.message }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - id: snapshot
        run: npm run snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: snapshot
          path: data
          retention-days: 1
          overwrite: true
          include-hidden-files: true

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Drop the checked-out data so the snapshot replaces it whole
        run: rm -rf data

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: snapshot
          path: data

      - name: Commit snapshot
        env:
          COMMIT_MESSAGE: ${{ needs.generate.outputs.message }}
          AUTHOR_NAME: ${{ vars.SNAPSHOT_AUTHOR_NAME }}
          AUTHOR_EMAIL: ${{ vars.SNAPSHOT_AUTHOR_EMAIL }}
        run: |
          git config user.name "${AUTHOR_NAME:-martin}"
          git config user.email "${AUTHOR_EMAIL:-martinlvila@gmail.com}"
          git add data
          if git diff --staged --quiet; then
            echo "No change in the published snapshot."
            exit 0
          fi
          git commit -m "${COMMIT_MESSAGE:-Record network state for $(date -u +%Y-%m-%d)}"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebasing onto the current main."
            git pull --rebase origin main
          done
          echo "Could not publish the snapshot after 3 attempts."
          exit 1
