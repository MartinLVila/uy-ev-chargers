name: Audit dependencies

on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:

concurrency:
  group: dependency-audit
  cancel-in-progress: false

permissions: {}

env:
  ALERT_TITLE: The dependency audit is failing on main

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      failing: ${{ steps.report.outputs.failing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Audit both surfaces
        id: audit
        run: |
          mkdir -p audit-output
          set +e
          npm audit --omit=dev --audit-level=moderate > audit-output/ships.txt 2>&1
          ships=$?
          npm audit --audit-level=high > audit-output/everything.txt 2>&1
          everything=$?
          set -e

          npm audit --json > audit-output/everything.json 2>/dev/null || true
          npm audit --omit=dev --json > audit-output/ships.json 2>/dev/null || true

          {
            echo "ships=${ships}"
            echo "everything=${everything}"
          } >> "$GITHUB_OUTPUT"

      - name: Write the report
        id: report
        env:
          SHIPS: ${{ steps.audit.outputs.ships }}
          EVERYTHING: ${{ steps.audit.outputs.everything }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npx tsx scripts/write-audit-report.ts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: audit-report
          path: audit-output/report.md
          retention-days: 7
          overwrite: true

  alert:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: audit-report

      - name: Open, update or close the alert
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ env.ALERT_TITLE }}
          FAILING: ${{ needs.audit.outputs.failing }}
        run: |
          if [ "$FAILING" != "yes" ] && [ "$FAILING" != "no" ]; then
            echo "The audit reached no verdict, so this run claims nothing about the alert."
            exit 1
          fi

          open_alert=$(gh issue list --state open --limit 200 --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")

          if [ "$FAILING" = "yes" ]; then
            if [ -n "$open_alert" ]; then
              gh issue edit "$open_alert" --body-file report.md
            else
              gh issue create --title "$TITLE" --body-file report.md
            fi
          elif [ -n "$open_alert" ]; then
            gh issue comment "$open_alert" --body-file report.md
            gh issue close "$open_alert" --reason completed
          fi

      - name: Fail the run when a surface is failing
        if: needs.audit.outputs.failing == 'yes'
        run: exit 1
